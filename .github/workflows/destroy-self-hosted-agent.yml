name: Destroy self-hosted agent infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'yes' to confirm destruction"
        required: true
        default: ""

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: true
  TF_VAR_admin_password: ${{ secrets.TF_VAR_ADMIN_PASSWORD }}
  TF_VAR_azure_devops_pat: ${{ secrets.TF_VAR_AZURE_DEVOPS_PAT }}

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: terraform-destroy
    defaults:
      run:
        working-directory: self-hosted-agent

    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "yes" ]; then
            echo "Destruction cancelled. You must type 'yes' to confirm."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform destroy
        run: terraform destroy -input=false -auto-approve
